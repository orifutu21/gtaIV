<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f4d3a">
<title>Rumbo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: cálido, cercano, sin sermones; un amigo que te acompaña cada mañana
   IDEA: una brújula de bolsillo; cada hábito cumplido llena el anillo del día
   PICTURE: el anillo de progreso de hoy, grande, con la aguja apuntando a tu "porqué"
   COLOUR and TYPE: verde bosque (crecer) + blanco + naranja amanecer; Outfit + Inter
   LAYOUT: una columna de móvil, barra de pestañas abajo, todo a un pulgar de distancia */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1f19);--card:light-dark(#f1f6f3,#17302a);--ink:light-dark(#13261e,#e9f3ee);--mute:light-dark(#5b6f66,#9db5aa);--g:light-dark(#1f4d3a,#5fc79a);--sun:#ff7a45;--line:light-dark(#d9e5df,#25463b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Outfit,system-ui,sans-serif;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:34px}h2{font-size:24px;margin:28px 0 12px}
main{max-width:560px;margin:0 auto;padding:20px 16px 110px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.date{color:var(--mute);font-size:14px}
.hero{display:grid;place-items:center;margin:18px 0 8px;position:relative}
.hero svg{width:min(260px,70vw);height:auto}
.hero .num{position:absolute;text-align:center;font-family:Outfit;}
.hero .num b{display:block;font-size:44px;line-height:1}
.hero .num span{font-size:14px;color:var(--mute)}
.quote{background:var(--g);color:#fff;border-radius:18px;padding:16px 18px;margin:12px 0;font-size:15px}
.quote small{opacity:.8;display:block;margin-top:6px}
.list{display:grid;gap:10px}
.hab{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;border:2px solid transparent;transition:border-color .2s}
.hab.done{border-color:var(--g)}
.hab .t{flex:1}.hab .t b{display:block;font-weight:600}.hab .t small{color:var(--mute);font-size:13px}
.chk{width:48px;height:48px;border-radius:50%;border:2px solid var(--g);background:transparent;color:var(--g);font-size:22px;cursor:pointer;flex:none}
.hab.done .chk{background:var(--g);color:var(--bg)}
.streak{font-size:13px;color:var(--sun);font-weight:600;white-space:nowrap}
button,input,textarea{font:inherit;color:inherit}
.btn{min-height:44px;padding:10px 18px;border-radius:12px;border:0;background:var(--g);color:var(--bg);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--g);border:2px solid var(--g)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
input,textarea{width:100%;font-size:16px;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-weight:600;margin:14px 0 6px}
label small{font-weight:400;color:var(--mute)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.moods button{flex:1;min-width:52px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:13px}
.moods button.on{background:var(--sun);border-color:var(--sun);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;border-radius:22px;border:1.5px solid var(--g);background:transparent;color:var(--g);padding:8px 14px;cursor:pointer;font-size:14px}
.chips button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.empty{background:var(--card);border-radius:16px;padding:18px;color:var(--mute)}
.grid{display:grid;gap:4px;grid-template-columns:repeat(14,minmax(0,1fr))}
.grid i{aspect-ratio:1;border-radius:4px;background:var(--line)}.grid i.on{background:var(--g)}
.prog{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.prog .h{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats div{background:var(--card);border-radius:14px;padding:12px;text-align:center}
.stats b{font-family:Outfit;font-size:28px;display:block;color:var(--g)}
.stats span{font-size:13px;color:var(--mute)}
.help{border-left:4px solid var(--sun);background:var(--card);padding:12px 14px;border-radius:0 12px 12px 0;font-size:14px;margin:14px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--bg);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:140px;min-height:52px;border:0;background:transparent;color:var(--mute);font-size:13px;font-weight:600;cursor:pointer;border-radius:12px}
nav button.on{color:var(--g);background:var(--card)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;font-size:14px;z-index:5}
.toast button{background:none;border:0;color:var(--sun);font-weight:700;cursor:pointer;min-height:36px}
.sync{font-size:12px;color:var(--mute);text-align:center;margin-top:24px}
.edit{display:flex;gap:6px}
@media (prefers-reduced-motion:no-preference){#arc{transition:stroke-dashoffset .6s ease}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav">
  <button data-v="hoy">Hoy</button>
  <button data-v="habitos">Hábitos</button>
  <button data-v="porque">Mi porqué</button>
  <button data-v="progreso">Progreso</button>
</nav>
<div id="toast" class="toast" hidden></div>
<script>
{
const KEY='rumbo-v1';
const SUGG=[
 ['Beber un vaso de agua al despertar','1 vaso'],
 ['Hacer la cama','30 segundos'],
 ['Caminar','10 minutos'],
 ['Leer','2 páginas'],
 ['Escribir 3 cosas buenas del día','1 frase'],
 ['Nada de móvil la primera media hora','5 minutos sin móvil'],
 ['Ejercicio','5 flexiones'],
 ['Acostarme antes de las 00:00','luces fuera'],
 ['Comer una fruta o verdura','1 pieza'],
 ['Aprender algo nuevo','5 minutos'],
 ['Hablar con alguien que me importa','1 mensaje'],
 ['Respirar con calma','1 minuto']
];
const FRASES=[
 'No tienes que saber a dónde vas para dar el siguiente paso.',
 'Pequeño y todos los días gana a grande y de vez en cuando.',
 'Si un día fallas, no pasa nada. Si fallas dos, vuelve mañana.',
 'No te conviertes en otra persona de golpe: votas por ella cada vez que cumples.',
 'Hazlo tan fácil que sea ridículo no hacerlo.',
 'Estar perdido es el principio de buscar. Ya estás buscando.',
 'Tu yo de dentro de un año te va a dar las gracias por hoy.',
 'La motivación va y viene. El hábito se queda.',
 'Hoy no cuenta lo perfecto, cuenta lo hecho.',
 'Cuida tu cuerpo, ordena tu día, y la cabeza se va aclarando.'
];
const MOODS=['Muy mal','Mal','Normal','Bien','Genial'];
let S={habits:[],log:{},why:{who:'',why:'',first:''}};
let view=(location.hash||'#hoy').slice(1);
let db=null,ref=null,saveT=null,syncMsg='Guardado en este móvil';

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dkey=d=>{const z=new Date(d);z.setMinutes(z.getMinutes()-z.getTimezoneOffset());return z.toISOString().slice(0,10)};
const today=()=>dkey(new Date());
const daysBack=n=>{const a=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);a.push(dkey(d))}return a};
const day=k=>S.log[k]||(S.log[k]={done:[],mood:null,note:''});
const uid=()=>Math.random().toString(36).slice(2,9);

function streak(id){let n=0;const d=new Date();if(!(S.log[dkey(d)]?.done||[]).includes(id))d.setDate(d.getDate()-1);
  while((S.log[dkey(d)]?.done||[]).includes(id)){n++;d.setDate(d.getDate()-1)}return n}
function best(id){let b=0,c=0;
  const keys=Object.keys(S.log).filter(k=>S.log[k].done.includes(id)).sort();let prev=null;
  for(const k of keys){const p=prev&&new Date(prev);if(p){p.setDate(p.getDate()+1)}c=(p&&dkey(p)===k)?c+1:1;b=Math.max(b,c);prev=k}return b}

function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(ref){clearTimeout(saveT);saveT=setTimeout(()=>{ref.set(JSON.parse(JSON.stringify(S))).then(()=>{syncMsg='Guardado en tu cuenta';syncEl()}).catch(()=>{syncMsg='Guardado solo en este móvil';syncEl()})},700)}}
function syncEl(){const e=document.getElementById('sync');if(e)e.textContent=syncMsg}

let toastT;
function toast(msg,undo){const t=document.getElementById('toast');t.innerHTML='<span></span>'+(undo?'<button>Deshacer</button>':'');
  t.firstChild.textContent=msg;t.hidden=false;if(undo)t.querySelector('button').onclick=()=>{undo();t.hidden=true;render()};
  clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,4500)}

function ring(p){const R=100,C=2*Math.PI*R;
  return `<svg viewBox="0 0 240 240" aria-hidden="true">
  <circle cx="120" cy="120" r="${R}" fill="none" stroke="var(--line)" stroke-width="16"/>
  <circle id="arc" cx="120" cy="120" r="${R}" fill="none" stroke="var(--g)" stroke-width="16" stroke-linecap="round"
   stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 120 120)"/>
  ${[0,90,180,270].map(a=>`<line x1="120" y1="8" x2="120" y2="2" stroke="var(--mute)" stroke-width="2" transform="rotate(${a} 120 120)"/>`).join('')}
  <polygon points="120,${p>=1?22:34} 126,52 114,52" fill="var(--sun)" transform="rotate(${p*360} 120 120)"/>
  </svg>`}

function vHoy(){const t=today(),d=day(t),H=S.habits,done=H.filter(h=>d.done.includes(h.id)).length,p=H.length?done/H.length:0;
  const f=FRASES[(new Date().getDate()+new Date().getMonth())%FRASES.length];
  const fecha=new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
  const low=daysBack(3).filter(k=>S.log[k]?.mood!=null&&S.log[k].mood<=1).length>=2;
  return `<div class="top"><h1>Hoy</h1><span class="date">${esc(fecha)}</span></div>
  <div class="hero">${ring(p)}<div class="num"><b>${done}/${H.length}</b><span>${p>=1&&H.length?'¡Día completo!':'hábitos hechos'}</span></div></div>
  ${S.why.who?`<div class="quote">Hoy doy un paso hacia: <b></b><small>Tu porqué</small></div>`:`<div class="quote">${esc(f)}</div>`}
  ${H.length?`<div class="list">${H.map(h=>{const on=d.done.includes(h.id),s=streak(h.id);
    return `<div class="hab ${on?'done':''}"><button class="chk" data-tog="${h.id}" aria-label="Marcar ${esc(h.name)}">${on?'✓':''}</button>
    <div class="t"><b>${esc(h.name)}</b><small>Mínimo: ${esc(h.min||'lo que puedas')}</small></div>${s?`<span class="streak">${s>1?s+" días seguidos":"1 día"}</span>`:''}</div>`}).join('')}</div>`
  :`<div class="empty"><b>Empieza por poco.</b> Elige 2 o 3 hábitos pequeños en la pestaña <b>Hábitos</b>. Mejor fácil y constante que perfecto.<div class="row"><button class="btn" data-go="habitos">Elegir mis hábitos</button></div></div>`}
  <h2>¿Cómo te sientes hoy?</h2>
  <div class="moods">${MOODS.map((m,i)=>`<button data-mood="${i}" class="${d.mood===i?'on':''}">${m}</button>`).join('')}</div>
  ${low?`<div class="help">Llevas unos días sintiéndote mal. No tienes que poder con todo solo: habla con alguien de confianza. Si lo pasas muy mal, en España puedes llamar al <b>024</b> (gratis, 24 h) o a la línea de ayuda de tu país.</div>`:''}
  <label for="note">Una frase sobre tu día <small>(opcional)</small></label>
  <textarea id="note" placeholder="Hoy he aprendido… / Hoy me ha costado… / Mañana quiero…"></textarea>
  <p class="sync" id="sync">${esc(syncMsg)}</p>`}

function vHab(){const names=S.habits.map(h=>h.name);
  return `<h1>Mis hábitos</h1>
  <p style="color:var(--mute)">Consejo: empieza con 2 o 3. Ponle a cada uno una <b>versión mínima</b>, tan fácil que la puedas hacer incluso en un mal día.</p>
  <div class="list">${S.habits.map(h=>`<div class="hab"><div class="t"><b>${esc(h.name)}</b><small>Mínimo: ${esc(h.min||'—')} · mejor racha ${best(h.id)}</small></div>
   <div class="edit"><button class="btn sm ghost" data-ed="${h.id}">Editar</button><button class="btn sm ghost" data-del="${h.id}" aria-label="Borrar">Borrar</button></div></div>`).join('')||'<div class="empty">Aún no tienes hábitos. Elige alguno de abajo o crea el tuyo.</div>'}</div>
  <h2 id="ftitle">Nuevo hábito</h2>
  <form id="f"><input type="hidden" id="fid">
   <label for="fn">¿Qué quieres hacer?</label><input id="fn" required maxlength="60" placeholder="Ej: Salir a caminar">
   <label for="fm">Versión mínima <small>(lo más pequeño que cuenta)</small></label><input id="fm" maxlength="40" placeholder="Ej: 10 minutos">
   <div class="row"><button class="btn" type="submit">Guardar</button><button class="btn ghost" type="button" id="fc" hidden>Cancelar</button></div></form>
  <h2>Ideas para empezar</h2>
  <div class="chips">${SUGG.map((s,i)=>`<button data-sug="${i}" ${names.includes(s[0])?'disabled':''}>+ ${esc(s[0])}</button>`).join('')}</div>`}

function vWhy(){return `<h1>Mi porqué</h1>
  <p style="color:var(--mute)">Sentirse perdido es normal. No necesitas tener toda la vida resuelta: basta con saber en qué dirección quieres caminar. Escríbelo aquí y vuelve a leerlo cuando flaquees.</p>
  <label for="w1">¿Quién quiero ser dentro de un año?</label><textarea id="w1" data-why="who" placeholder="Alguien que se cuida, que tiene energía, que cumple lo que se promete…"></textarea>
  <label for="w2">¿Por qué me importa?</label><textarea id="w2" data-why="why" placeholder="Porque estoy cansado de sentirme así, porque quiero…"></textarea>
  <label for="w3">Si me siento perdido, lo primero que haré es…</label><textarea id="w3" data-why="first" placeholder="Salir a caminar 10 minutos y hablar con alguien."></textarea>
  <p class="sync">Se guarda solo mientras escribes.</p>`}

function vProg(){const ks=daysBack(14),H=S.habits;
  const total=Object.values(S.log).reduce((a,d)=>a+d.done.length,0);
  const full=Object.keys(S.log).filter(k=>H.length&&H.every(h=>S.log[k].done.includes(h.id))).length;
  const top=Math.max(0,...H.map(h=>best(h.id)));
  const moods=ks.map(k=>S.log[k]?.mood);const mv=moods.filter(m=>m!=null);
  return `<h1>Tu progreso</h1>
  <div class="stats" style="margin-top:16px"><div><b>${total}</b><span>veces cumplido</span></div><div><b>${full}</b><span>días completos</span></div><div><b>${top}</b><span>mejor racha</span></div></div>
  <h2>Últimos 14 días</h2>
  ${H.map(h=>{const n=ks.filter(k=>S.log[k]?.done.includes(h.id)).length;return `<div class="prog"><div class="h"><b>${esc(h.name)}</b><span>${n}/14</span></div>
   <div class="grid">${ks.map(k=>`<i class="${S.log[k]?.done.includes(h.id)?'on':''}" title="${k}"></i>`).join('')}</div></div>`}).join('')||'<div class="empty">Cuando marques hábitos, aquí verás tu camino.</div>'}
  <h2>Ánimo</h2>
  ${mv.length?`<div class="prog"><div class="grid">${moods.map(m=>`<i style="${m!=null?`background:var(--sun);opacity:${.25+m*.19}`:''}" title="${m!=null?MOODS[m]:'sin dato'}"></i>`).join('')}</div>
  <p style="margin:8px 0 0;font-size:14px;color:var(--mute)">Media: ${MOODS[Math.round(mv.reduce((a,b)=>a+b,0)/mv.length)]}. Más naranja = mejor día.</p></div>`:'<div class="empty">Marca cómo te sientes cada día en <b>Hoy</b>.</div>'}
  <h2>Tus notas</h2>
  ${Object.keys(S.log).sort().reverse().filter(k=>S.log[k].note).slice(0,10).map(k=>`<div class="prog"><div class="h"><b>${esc(new Date(k+'T12:00').toLocaleDateString('es',{day:'numeric',month:'short'}))}</b></div><span class="note-t" data-k="${k}"></span></div>`).join('')||'<div class="empty">Aún no hay notas.</div>'}`}

function render(){if(!['hoy','habitos','porque','progreso'].includes(view))view='hoy';
  const A=document.getElementById('app');
  A.innerHTML={hoy:vHoy,habitos:vHab,porque:vWhy,progreso:vProg}[view]();
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  const q=A.querySelector('.quote b');if(q)q.textContent=S.why.who;
  const n=A.querySelector('#note');if(n){n.value=day(today()).note||'';n.oninput=()=>{day(today()).note=n.value;save()}}
  A.querySelectorAll('[data-why]').forEach(t=>{t.value=S.why[t.dataset.why]||'';t.oninput=()=>{S.why[t.dataset.why]=t.value;save()}});
  A.querySelectorAll('.note-t').forEach(e=>e.textContent=S.log[e.dataset.k].note);
  const f=A.querySelector('#f');if(f){f.onsubmit=e=>{e.preventDefault();const id=f.fid.value,name=f.fn.value.trim(),min=f.fm.value.trim();if(!name)return;
    if(id){Object.assign(S.habits.find(h=>h.id===id),{name,min})}else S.habits.push({id:uid(),name,min});save();toast('Guardado');render()};
    A.querySelector('#fc').onclick=()=>render()}}

document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset;
  if(D.tog){const d=day(today()),i=d.done.indexOf(D.tog);if(i<0){d.done.push(D.tog);if(navigator.vibrate)try{navigator.vibrate(20)}catch(_){}}else d.done.splice(i,1);save();render()}
  else if(D.mood){day(today()).mood=+D.mood;save();render()}
  else if(D.go){go(D.go)}
  else if(D.sug){const s=SUGG[+D.sug];S.habits.push({id:uid(),name:s[0],min:s[1]});save();toast('Añadido: '+s[0]);render()}
  else if(D.del){const i=S.habits.findIndex(h=>h.id===D.del),h=S.habits[i];S.habits.splice(i,1);save();render();
    toast('Hábito borrado',()=>{S.habits.splice(i,0,h);save()})}
  else if(D.ed){const h=S.habits.find(x=>x.id===D.ed),f=document.getElementById('f');f.fid.value=h.id;f.fn.value=h.name;f.fm.value=h.min||'';
    document.getElementById('ftitle').textContent='Editar hábito';document.getElementById('fc').hidden=false;f.fn.focus();f.scrollIntoView({block:'center'})}
});
function go(v){view=v;history.replaceState(null,'','#'+v);render();scrollTo(0,0)}
document.getElementById('nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};
addEventListener('hashchange',()=>{view=location.hash.slice(1);render()});

load();render();

(async()=>{try{if(!window.claude)return;db=await claude.use('db');const u=await claude.use('user');if(!db||!u)return;
  const id=await u.id();if(!id)return;ref=db.collection('data/users/'+id).doc('estado');
  const r=await Promise.race([ref.get(),new Promise((_,j)=>setTimeout(()=>j('t'),10000))]);
  let d=r&&(typeof r.data==='function'?r.data():(r.data!==undefined?r.data:r));
  if(d&&d.habits){S=Object.assign({habits:[],log:{},why:{}},d);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  else if(S.habits.length||Object.keys(S.log).length)save();
  syncMsg='Guardado en tu cuenta';const a=document.activeElement;if(!a||!/TEXTAREA|INPUT/.test(a.tagName))render();else syncEl()}
 catch(e){ref=null}})();
}
</script>
</body>
</html>
